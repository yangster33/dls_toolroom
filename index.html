    <script>
      // 首屏前应用主题，避免白图/蓝图切换时闪烁
      ;(function () {
        try {
          var legacy = {
            light: 'baitu',
            winter: 'baitu',
            corporate: 'baitu',
            business: 'baitu',
            dark: 'lantu',
            night: 'lantu',
            dracula: 'lantu',
            forest: 'lantu',
          }
          var saved = localStorage.getItem('dls_toolroom_theme')
          if (saved && legacy[saved]) saved = legacy[saved]
          if (saved !== 'baitu' && saved !== 'lantu') {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'lantu' : 'baitu'
          }
          document.documentElement.setAttribute('data-theme', saved)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'baitu')
        }
      })()
    </script>
