# 外部 API 同源反代：固定上游，前端走 /proxy/<name>/...
# 部署位置：/etc/nginx/snippets/dls_proxy_locations.conf，在 443 server 块内 include。
#
# 注意：路径变量必须用**命名捕获**，否则公共片段里的 if 正则会把 $1 覆盖成 GET。
location ~ ^/proxy/openmeteo/(?<upstream_path>.*)$ {
    include /etc/nginx/snippets/dls_proxy_common.conf;
    set $upstream_host api.open-meteo.com;
    proxy_pass https://$upstream_host/$upstream_path$is_args$args;
}

location ~ ^/proxy/openmeteo-archive/(?<upstream_path>.*)$ {
    include /etc/nginx/snippets/dls_proxy_common.conf;
    set $upstream_host archive-api.open-meteo.com;
    proxy_pass https://$upstream_host/$upstream_path$is_args$args;
}

location ~ ^/proxy/usgs/(?<upstream_path>.*)$ {
    include /etc/nginx/snippets/dls_proxy_common.conf;
    set $upstream_host earthquake.usgs.gov;
    proxy_pass https://$upstream_host/$upstream_path$is_args$args;
}

location ~ ^/proxy/gdacs/(?<upstream_path>.*)$ {
    include /etc/nginx/snippets/dls_proxy_common.conf;
    set $upstream_host www.gdacs.org;
    proxy_pass https://$upstream_host/$upstream_path$is_args$args;
}

# 未列出的 /proxy/* 一律 404，避免变成开放代理
location /proxy/ {
    return 404;
}
