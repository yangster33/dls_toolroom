# 站点安全响应头（F1）
#
# 用法：在 443 server {} 内 include 本文件：
#   include /etc/nginx/snippets/dls_security_headers.conf;
#
# 关键点：`worker-src 'self'` 必须存在。
# 文件处理 Worker（filePipeline.worker）从同源 /assets/*.js 加载；
# 如果部署侧已有 CSP 但漏了 worker-src，Worker 会被浏览器拦截并静默降级到
# 主线程 —— 功能不坏，但 C4 的 Worker 化就白做了。
#
# 注意：本仓库 index.html 有首屏主题脚本与 JSON-LD，因此 script-src 必须保留
# 'unsafe-inline'；百度统计 hm.js 需要放行 https://hm.baidu.com。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://hm.baidu.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
