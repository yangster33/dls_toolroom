# 每个上游 location 共用的代理参数
# 部署位置：/etc/nginx/snippets/dls_proxy_common.conf
resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;

if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
if ($request_method = OPTIONS) { return 204; }

limit_req zone=dls_api_req burst=40 nodelay;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $upstream_host;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header Accept-Encoding "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_ssl_server_name on;
proxy_ssl_name $upstream_host;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_connect_timeout 6s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

proxy_cache dls_api;
proxy_cache_key "$host$request_uri";
proxy_cache_valid 200 5m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock on;
proxy_cache_background_update on;

# 上游自带的 ACAO 一律丢弃，只回我们自己认可的来源
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;

add_header Access-Control-Allow-Origin $dls_cors_origin always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
add_header Access-Control-Max-Age 86400 always;
add_header Vary Origin always;
add_header X-DLS-Cache $upstream_cache_status always;
