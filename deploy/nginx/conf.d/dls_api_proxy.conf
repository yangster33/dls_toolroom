# ── 外部 API 同源反向代理（固定上游白名单，非开放代理）──
# 部署位置：/etc/nginx/conf.d/dls_api_proxy.conf
# 只做 GET/HEAD；按 IP 限速；结果缓存，跨境抖动时可用 stale 兜底。
proxy_cache_path /var/cache/nginx/dls_api levels=1:2 keys_zone=dls_api:16m
                 max_size=256m inactive=30m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=dls_api_req:10m rate=20r/s;

# 仅放行站点自身与本地开发来源，避免被别的网站白嫖带宽
map $http_origin $dls_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)?dlslab\.cn$" $http_origin;
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}
