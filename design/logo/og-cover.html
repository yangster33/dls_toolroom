<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #121d2b;
        background-image:
          linear-gradient(rgba(154, 200, 230, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(154, 200, 230, 0.07) 1px, transparent 1px);
        background-size: 24px 24px;
        color: #e7eef2;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(154, 200, 230, 0.28);
      }
      .corner {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: #9ac8e6;
        border-style: solid;
        border-width: 0;
      }
      .tl {
        top: 28px;
        left: 28px;
        border-top-width: 2px;
        border-left-width: 2px;
      }
      .tr {
        top: 28px;
        right: 28px;
        border-top-width: 2px;
        border-right-width: 2px;
      }
      .bl {
        bottom: 28px;
        left: 28px;
        border-bottom-width: 2px;
        border-left-width: 2px;
      }
      .br {
        bottom: 28px;
        right: 28px;
        border-bottom-width: 2px;
        border-right-width: 2px;
      }
      .meta {
        position: absolute;
        top: 52px;
        left: 64px;
        right: 64px;
        display: flex;
        justify-content: space-between;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(231, 238, 242, 0.55);
        text-transform: uppercase;
      }
      .mark {
        position: absolute;
        left: 64px;
        top: 150px;
        width: 700px;
      }
      .mark img {
        display: block;
        width: 100%;
      }
      .tag {
        position: absolute;
        left: 68px;
        top: 392px;
        font-family: 'FangSong', 'STFangsong', 'Songti SC', serif;
        font-size: 52px;
        letter-spacing: 0.08em;
        line-height: 1.3;
        color: #f1f6f9;
      }
      .desc {
        position: absolute;
        left: 70px;
        top: 474px;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: rgba(231, 238, 242, 0.62);
      }
      .rule {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 86px;
        height: 1px;
        background: rgba(231, 238, 242, 0.2);
      }
      .foot {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 54px;
        display: flex;
        justify-content: space-between;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        color: rgba(231, 238, 242, 0.45);
        text-transform: uppercase;
      }
      .ghost {
        position: absolute;
        right: -70px;
        bottom: -60px;
        width: 430px;
        opacity: 0.06;
      }
      .ghost img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="ghost"><img src="../../public/brand/logo-mark-dark.svg" alt="" /></div>
    <div class="frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="meta">
      <span>Dalongshan / Brand Mark</span>
      <span>DLSLAB.CN</span>
    </div>

    <div class="mark"><img src="../../public/brand/logo-lockup-dark.svg" alt="大龙山工具间" /></div>

    <div class="tag">山脊之上，信号可达。</div>
    <div class="desc">通信工程科研 · 规划 · 设计工具集</div>

    <div class="rule"></div>
    <div class="foot">
      <span>大龙山工具间 / Dalongshan Toolroom</span>
      <span>白图 · 蓝图 / 2026</span>
    </div>
  </body>
</html>
